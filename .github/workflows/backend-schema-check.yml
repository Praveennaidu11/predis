name: Backend - schema drift check

on:
  pull_request:
    paths:
      - "Predis-Amealio-Backend/**"
      - ".github/workflows/**"
  push:
    branches: ["main", "master"]
    paths:
      - "Predis-Amealio-Backend/**"
      - ".github/workflows/**"

jobs:
  schema_check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amealio_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: Predis-Amealio-Backend
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: amealio_db
      DB_SSL: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Predis-Amealio-Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        run: npm run migration:run

      - name: Schema drift check
        run: npm run schema:check

